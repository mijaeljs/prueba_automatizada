<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar Sesión</title>
  <style>
    /* Fondo con imagen */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url("recursos/0035.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    /* Fondo oscuro semitransparente para mejorar lectura */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: rgba(0, 0, 0, 0.5); /* Oscurece el fondo ligeramente */
    }

    /* Logo */
    .logo img {
      width: 120px;
      margin-bottom: 20px;
    }

    /* Caja del login semitransparente */
    .login-box {
      background: rgba(255, 255, 255, 0.1); /* Blanco muy tenue */
      backdrop-filter: blur(10px); /* Efecto glass */
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 30px;
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: white;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 12px;
      background-color: white;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: box-shadow 0.3s ease;
    }

    .input-group input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
    }

    .btn_login {
      width: 100%;
      padding: 12px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-weight: bold;
    }

    .btn_login:hover {
      background-color: #333;
    }

    .forgot-password {
      display: block;
      margin-top: 15px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .forgot-password:hover {
      color: #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="recursos/logo.png" alt="logo" />
    </div>
    <div class="login-box">
      <h2>INICIAR SESIÓN</h2>
      <form>
        <div class="input-group">
          <label for="username">USUARIO</label>
          <input type="text" id="username" name="username" placeholder="" />
        </div>
        <div class="input-group">
          <label for="password">CONTRASEÑA</label>
          <input type="password" name="password" id="password" placeholder="" />
        </div>
        <button type="submit" class="btn_login">INGRESAR</button>
      </form>
      <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</body>
</html>
